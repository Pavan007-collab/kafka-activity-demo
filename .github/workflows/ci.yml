name: Kafka Activity Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Spring Boot Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: activity_tracking_db
          POSTGRES_USER: activity_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U activity_user -d activity_tracking_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: activity-consumer
        env:
          DB_PASSWORD: ci_password
        run: ./mvnw -B clean test

  frontend:
    name: React Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: activity-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: activity-dashboard
        run: npm ci

      - name: Run ESLint
        working-directory: activity-dashboard
        run: npm run lint

      - name: Build frontend
        working-directory: activity-dashboard
        run: npm run build

  docker-publish:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./activity-consumer
          push: true
          tags: |
            ghcr.io/pavan007-collab/kafka-activity-consumer:latest
            ghcr.io/pavan007-collab/kafka-activity-consumer:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./activity-dashboard
          push: true
          tags: |
            ghcr.io/pavan007-collab/kafka-activity-dashboard:latest
            ghcr.io/pavan007-collab/kafka-activity-dashboard:${{ github.sha }}
