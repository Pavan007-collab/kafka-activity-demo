spring.application.name=activity-consumer

# Kafka broker connection
spring.kafka.bootstrap-servers=localhost:9092

# Consumer group configuration
spring.kafka.consumer.group-id=activity-tracking-db-group
spring.kafka.consumer.auto-offset-reset=earliest

# Read Kafka messages as strings
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
server.port=8092
# Kafka producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5434/activity_tracking_db
spring.datasource.username=activity_user
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
